#################
## Reference :
## https://blog.canopas.com/integrate-version-catalog-in-android-2f26d6fff3ea
#################

[versions]
javafxPlugin = "0.1.0"

# General dependncies versions
# Arbor
arbor = "2.0.105"
# Compose
compose = "1.11.1"
composeHotReload = "1.0.0"
jna = "5.19.1"
# Json
jakartaJson = "2.1.2"
json = "20231013"
jackson = "2.18.2"
# JavaFx
javafxWeb = "21"
jetbrainsJcef = "0.1"
# Kotlin
kotlin = "2.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.8.1"
# Ktor
ktor = "3.5.1"
logback = "1.5.18"
nativeParametersStoreAccess = "0.1.3"
# Kotools Types
types = "5.2.0"
# VlcJ
vlcJavaFX = "1.2.1"
vlcInfo = "2.0.1"
vlcNatives = "4.8.3"
vlcOsx = "2.0.0"
vlcPlayer = "4.11.0"
#vlcPlayer = "5.0.0-M4"
#YoutubePlayer
youtubePlayer = "13.0.0"
# Zxing
zxing = "3.5.3"


[libraries]
# placeholder : lib-name = { group = "", name = "", version.ref = "" }
# Arbor
arbor = { group = "com.ToxicBakery.logging", name = "arbor-jvm", version.ref = "arbor" }
# Compose
compose-full = { group = "org.jetbrains.compose", name = "compose-full", version.ref = "compose" }
# JavaFX
javafx-web = { group = "org.openjfx", name = "javafx-web", version.ref = "javafxWeb" }
# Jetbrains
# JCEF
jetbrains-jcef-skiko = { group = "org.jetbrains.jcef", name = "jcef-skiko", version.ref = "jetbrainsJcef" }
# JNA : (IMPORTANT) vlcj has a dependency on JNA.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
# Json
jakarta-json = { group = "jakarta.json", name = "jakarta.json-api", version.ref = "jakartaJson" }
org-json = { group = "org.json", name = "json", version.ref = "json" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-dataformat = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-xml", version.ref = "jackson" }
native-parameters-store-access = { group = "com.github.tkuenneth", name = "nativeparameterstoreaccess", version.ref = "nativeParametersStoreAccess" }
# Kotlin
kotlin-bom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlinx-coroutines-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-bom", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Ktor
ktor-bom = { group = "io.ktor", name = "ktor-bom", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation" }
ktor-client-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json" }
# Kotools
kotools-types = { group = "org.kotools", name = "types", version.ref = "types" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
# Vlc Player
vlc-player = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcPlayer" }
vlc-java-fx = { group = "uk.co.caprica", name = "vlcj-javafx", version.ref = "vlcJavaFX" }
vlc-info = { group = "uk.co.caprica", name = "vlcj-info", version.ref = "vlcInfo" }
vlc-natives = { group = "uk.co.caprica", name = "vlcj-natives", version.ref = "vlcNatives" }
vlc-osx = { group = "uk.co.caprica", name = "vlcj-osx-stubs", version.ref = "vlcOsx" }
# YoutubePlayer
youtube-player = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "youtubePlayer" }
# zxing
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-javase = { group = "com.google.zxing", name = "javase", version.ref = "zxing" }


# Build-logic's gradle plugin dependencies
jetbrains-compose-gradlePlugin = { group = "org.jetbrains.compose", name = "org.jetbrains.compose.gradle.plugin", version.ref = "compose" }
ktor-gradlePlugin = { group = "io.ktor.plugin", name = "io.ktor.plugin.gradle.plugin", version.ref = "ktor" }


[plugins]
java-fx = { id = "org.openjfx.javafxplugin", version.ref = "javafxPlugin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
jetbrains-compose-hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Compose Compiler - introduced by Kotlin 2.0
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

# Build-logic plugins
thelabdesk-application-compose = { id = "com.riders.thelabdesk.application.jvm.compose", version = "unspecified" }
thelabdesk-application = { id = "com.riders.thelabdesk.application.jvm", version = "unspecified" }
thelabdesk-compose-desktop = { id = "com.riders.thelabdesk.compose.desktop", version = "unspecified" }
thelabdesk-feature = { id = "com.riders.thelabdesk.feature", version = "unspecified" }
thelabdesk-feature-compose = { id = "com.riders.thelabdesk.feature.compose", version = "unspecified" }
thelabdesk-javafx = { id = "com.riders.thelabdesk.javafx", version = "unspecified" }
thelabdesk-library = { id = "com.riders.thelabdesk.library", version = "unspecified" }